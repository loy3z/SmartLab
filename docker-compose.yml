# Sprint 3 (2026-10-25): docker-compose deployment (PostgreSQL + API + nginx). Steps: DEPLOY.md.
# Run with: docker compose --env-file .env.docker up -d --build
#
# PostgreSQL data lives in the pgdata volume. Uploaded induction evidence is stored inside
# PostgreSQL (stored_file table), so no separate file volume is needed.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-smartlab}
      POSTGRES_USER: ${DB_USER:-smartlab}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.docker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-smartlab} -d ${DB_NAME:-smartlab}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env.docker}
      DEBUG: ${DEBUG:-false}
      # 127.0.0.1 is always allowed so the health check below keeps working whatever host names are set.
      ALLOWED_HOSTS: 127.0.0.1,${ALLOWED_HOSTS:-localhost}
      ENABLE_DEMO_AUTH: ${ENABLE_DEMO_AUTH:-true}
      ENABLE_TEST_CONSOLE: "false"
      # Never inject the in-code demo data into PostgreSQL (database/README.md): it would run in every worker on
      # every start and overwrite the rooms, equipment and staff passwords. The demo data is loaded once instead,
      # when the database is created (LOAD_DEMO_DATA, see entrypoint.sh).
      SEED_DEMO_DATA: "false"
      LOAD_DEMO_DATA: ${LOAD_DEMO_DATA:-false}
      REPOSITORY_FACTORY: booking.postgres.PostgresRepository
      FILE_STORAGE_FACTORY: booking.postgres.PostgresFileStorage
      DB_NAME: ${DB_NAME:-smartlab}
      DB_USER: ${DB_USER:-smartlab}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
      # Address people open in the browser; used for links in emails.
      SITE_URL: ${SITE_URL:-http://localhost}
      OUTLOOK_ENABLED: "false"
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/v1/health/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"
    restart: unless-stopped

volumes:
  pgdata:
